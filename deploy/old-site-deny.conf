# deploy/old-site-deny.conf — v1 실습 사이트(root /var/www/html)에서 이 저장소를 숨긴다
#
# 왜 필요한가: 재구축 저장소(v2)가 v1 의 웹 루트 안(/var/www/html/T-Box_Re)에 있다.
# v2 사이트는 root 가 public/ 이라 안전하지만, v1 은 root 가 /var/www/html 이고 모든 .php 를
# 실행하므로 /T-Box_Re/src/Db.php · /T-Box_Re/.env · /T-Box_Re/db/schema.sql 이 그대로 노출된다.
#
# 설치: 저장소의 v1 사이트 파일이 이미 이 줄을 include 하고 있다 —
#   deploy/sites/tbox-v1.conf  ·  deploy/sites/tbox-v1-local.conf 의 server { } 첫 줄
#     include /var/www/html/T-Box_Re/deploy/old-site-deny.conf;
# 두 파일은 deploy/switch-site.sh 가 /etc/nginx/sites-available/{tbox-v1,tbox-v1-local} 로 복사한다.
# (예전에는 install.sh 가 /etc/nginx/sites-available/tbox 에 이 줄을 awk 로 끼워 넣었다.
#  이제 v1 설정 자체가 저장소에 있으므로 그 삽입 로직은 없앴고, 옛 파일은
#  /etc/nginx/sites-available/legacy-1단계/ 로 옮겨 보존한다.)
#
# ^~ 는 "이 접두어에 맞으면 정규식 location 을 더 보지 않는다" 는 뜻이다.
# v1 의 `location ~ \.php$`(PHP 실행) 보다 먼저 이겨야 하므로 ^~ 를 쓴다.

location ^~ /T-Box_Re/ { return 404; }
location = /T-Box_Re   { return 404; }
