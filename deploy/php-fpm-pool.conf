; deploy/php-fpm-pool.conf — php-fpm 전용 풀 (ARCHITECTURE 9장, PRD S-09-10)
;
; 설치 위치: /etc/php/8.1/fpm/pool.d/tbox.conf  (deploy/install.sh 가 cp 로 복사)
; 옛 t-box 의 www 풀(www-data)과 완전히 분리된 계정·소켓을 쓴다
;   → 옛 사이트가 뚫려도 이 앱의 파일·소켓에 손댈 수 없다.

[tbox]
user  = tbox-php
group = tbox-php

listen       = /run/php/php8.1-fpm-tbox.sock
listen.owner = www-data          ; nginx 가 소켓에 연결해야 한다
listen.group = www-data
listen.mode  = 0660

; 실습 VM 은 자원이 넉넉하지 않다. 요청이 올 때만 프로세스를 띄운다.
pm                   = ondemand
pm.max_children      = 5
pm.process_idle_timeout = 30s
pm.max_requests      = 500

; ─── 업로드 (PRD S-06) ───
php_admin_value[upload_max_filesize] = 100M
php_admin_value[post_max_size]       = 105M
php_admin_value[max_file_uploads]    = 1          ; 요청당 파일 1개

; ─── 오류 (PRD S-09-7) ───
php_admin_flag[display_errors]         = off
php_admin_flag[display_startup_errors] = off
php_admin_flag[log_errors]             = on
php_admin_value[error_log]             = /var/log/tbox/app.log

; ─── 세션 ───
; 세션은 DB(sessions 표)에 두지만(ARCH 6.2-2), PHP 기본 세션이 실수로 켜져도
; 웹 루트 밖에 저장되고 쿠키 속성이 안전하도록 미리 지정한다.
php_admin_value[session.save_path]       = /var/lib/tbox/sessions
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.cookie_secure]   = 1
php_admin_value[session.cookie_samesite] = Lax
php_admin_value[session.use_strict_mode] = 1      ; 세션 고정 공격 방지

; ─── 안전망 (실수로 위험한 코드를 짜도 실행 단계에서 한 번 더 막는다) ───
php_admin_flag[allow_url_fopen]      = off        ; ★ file_get_contents('http://...') 자체를 막음 (S-05 ⑫⑬)
php_admin_value[open_basedir]        = /var/www/html/T-Box_Re:/var/lib/tbox:/var/log/tbox:/etc/tbox:/tmp
; 소켓·프로세스 함수 차단 (SECURITY R-03). cURL 은 7단계(F-14)에 필요하므로 남겨 둔다 —
; 대신 src/Fetch.php 밖의 curl_* 는 scripts/security_lint.sh 가 반려한다.
php_admin_value[disable_functions]   = fsockopen,pfsockopen,stream_socket_client,stream_socket_server,exec,system,shell_exec,passthru,popen,proc_open

; ─── 정보 노출 최소화 ───
php_admin_value[expose_php] = 0
