; deploy/php-fpm-pool.conf — php-fpm 전용 풀 (ARCHITECTURE 9장, PRD S-09-10)
;
; 설치 위치: /etc/php/8.1/fpm/pool.d/tbox.conf  (deploy/install.sh 가 cp 로 복사)
; 옛 t-box 의 www 풀(www-data)과 완전히 분리된 계정·소켓을 쓴다
;   → 옛 사이트가 뚫려도 이 앱의 파일·소켓에 손댈 수 없다.

[tbox]
user  = tbox-php
group = tbox-php

listen       = /run/php/php8.1-fpm-tbox.sock
listen.owner = www-data          ; nginx 가 소켓에 연결해야 한다
listen.group = www-data
listen.mode  = 0660

; ─── 워커 수·요청 시간 제한 (Q:F-4 P-7, ARCH 9.1 · SECURITY R-103) ───
; 전에는 `ondemand`·최대 5개·유휴 30초였다. 큰 업로드·URL 가져오기 몇 건이 워커 5개를 붙잡으면 사이트 전체가
; 멈췄고(대기열), 요청 시간에 끝이 없었다. 값의 근거는 2026-09-24 임시 인스턴스 실측(아래 숫자 — 비root 사본 풀·
; 운영 복사 임시 DB, 측정 동안에만 시간 제한을 끄고 PHP 쪽 시간을 FPM 접근 로그로 쟀다).
;
; dynamic — 쉬는 워커를 늘 2~4개 둔다. ondemand 는 30초 쉬면 워커를 내려 다음 요청이 워커를 새로 띄우고
;   DB 에 새로 붙어야 했다(P-2 연결 재사용이 한가할 때 사라짐). 이제 쉬는 워커가 연결을 들고 기다린다.
pm                   = dynamic
; 8 — 실측 워커 하나 RSS 20~32MB · 8개 합 RSS 약 205MB(PSS 약 49MB — 공유 페이지를 나눠 센 값), 마스터 7MB.
;   운영 5개 합 RSS 는 약 97MB(2026-09-24 20:49, free 1.5GB 사용 · 1.9GB 여유). 이론 최악은 8 × memory_limit 128M
;   = 1GB 이고, 그때 clamscan 1회(최대 991MB, R-86)까지 겹치면 RAM 3.9GB 에 빠듯하다(스왑 2GB) — 그 이상은 늘리지 않는다.
;   DB 연결은 워커마다 1개(P-2)라 이 풀에서 최대 8(+ 권한 매트릭스 요청 동안 perm 1).
pm.max_children      = 8
pm.start_servers     = 2
pm.min_spare_servers = 2
; 쉬는 워커가 4개를 넘으면 1초에 하나씩 내린다(실측: 8개로 데운 뒤 12초에 4개)
pm.max_spare_servers = 4
pm.max_requests      = 500
; 90s — 워커 하나가 한 요청을 쥘 수 있는 벽시계 상한. 넘으면 FPM 마스터가 그 워커를 죽인다
;   (DB 연결이 끊기며 열린 트랜잭션은 서버가 되돌린다). 실측한 가장 긴 정상 요청(PHP 쪽):
;     URL 가져오기 리다이렉트 3번 × 9초 + 100MB  29.4초 · 최악(리다이렉트 3번 × 9.5초 + 느린 본문) 38.7초 → 400
;       (Fetch 는 한 단계에 연결 3초·전체 10초, 최대 4단계 — 내려받기 상한 약 40초 + 검증)
;     100MB 업로드 1.8~2.8초(느린 손님 10MB/s 도 PHP 쪽 2.8초 — nginx 가 본문을 다 받은 뒤 넘긴다)
;     100MB 미리보기 1.1~1.8초(sha256 대조 포함) · 100MB 다운로드 1.5~1.9초(느린 손님 5MB/s 도 PHP 쪽 1.7초 —
;       readfile 응답을 nginx 가 임시 파일로 받아 두고 손님에게 천천히 보낸다. X-Accel-Redirect 는 쓰지 않는다, R-34)
;   nginx 는 `fastcgi_read_timeout 60s` 에 504 를 낸다(응답 없이 60초). 이 값은 그보다 길게 둬서 nginx 가 아직
;   기다리는 요청을 FPM 이 먼저 끊지 않게 하고, 가져오기 상한(약 40초)의 두 배 이상이다. 60초를 넘는 정상 경로는 없다.
;   504 뒤에도 PHP 가 워커를 쥐는 시간은 최대 30초(90 − 60)다.
request_terminate_timeout = 90s

; ─── 업로드 (PRD S-06) ───
php_admin_value[upload_max_filesize] = 100M
php_admin_value[post_max_size]       = 105M
php_admin_value[max_file_uploads]    = 1          ; 요청당 파일 1개

; ─── 오류 (PRD S-09-7) ───
php_admin_flag[display_errors]         = off
php_admin_flag[display_startup_errors] = off
php_admin_flag[log_errors]             = on
php_admin_value[error_log]             = /var/log/tbox-v2/app.log

; ─── 세션 ───
; 세션은 DB(sessions 표)에 두지만(ARCH 6.2-2), PHP 기본 세션이 실수로 켜져도
; 웹 루트 밖에 저장되고 쿠키 속성이 안전하도록 미리 지정한다.
php_admin_value[session.save_path]       = /var/lib/tbox-v2/sessions
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.cookie_secure]   = 1
php_admin_value[session.cookie_samesite] = Lax
php_admin_value[session.use_strict_mode] = 1      ; 세션 고정 공격 방지

; ─── 안전망 (실수로 위험한 코드를 짜도 실행 단계에서 한 번 더 막는다) ───
php_admin_flag[allow_url_fopen]      = off        ; ★ file_get_contents('http://...') 자체를 막음 (S-05 ⑫⑬)
php_admin_value[open_basedir]        = /var/www/qaredi/tbox-v2:/var/lib/tbox-v2:/var/log/tbox-v2:/etc/tbox-v2:/tmp
; 소켓·프로세스 함수 차단 (SECURITY R-03). cURL 은 7단계(F-14)에 필요하므로 남겨 둔다 —
; 대신 src/Fetch.php 밖의 curl_* 는 scripts/security_lint.sh 가 반려한다.
php_admin_value[disable_functions]   = fsockopen,pfsockopen,stream_socket_client,stream_socket_server,exec,system,shell_exec,passthru,popen,proc_open

; ─── 정보 노출 최소화 ───
php_admin_value[expose_php] = 0
