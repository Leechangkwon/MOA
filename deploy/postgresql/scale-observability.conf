# /etc/postgresql/14/main/conf.d/tbox-scale.conf — 기존 preload 목록을 합쳐서 적용.
# installed Debian/Ubuntu postgresql-14 contrib module, PostgreSQL 재시작1회 필요.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
pg_stat_statements.track_utility = off
log_min_duration_statement = '500ms'
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_temp_files = '10MB'
# 기존 logging_collector=off·postgresql-common logrotate 유지; 보관량은 별도 logrotate 예시 참조.
