# deploy/push.conf → /etc/tbox-v2/push.conf   (root:root 0644 — 비밀 없음. 반영 스크립트 apply-f70-host 가 설치)
#
# 휴대폰 경보 **보내는 배치**(scripts/alert_push.php, OS 계정 tbox-push)의 설정 한 벌 (PRD F-70, 구현 기록 3).
# 이 배치는 저장소 .env 를 읽지 않는다 — .env 에는 앱 계정 tbox_app 의 비밀번호와 APP_SECRET 이 있다.
# 형식은 .env 와 같다(KEY=VALUE · # 주석 — src/Env.php 파서). 값에 비밀을 넣지 않는다:
#   DB 비밀번호는 PGPASSFILE(tbox-push 0600)에만 있고, PHP 는 그 파일을 열지 않는다 — libpq 가 직접 읽는다.
#   VAPID 비밀 키는 VAPID_PRIVATE_KEY_FILE(tbox-push 0600)에만. 웹 계정(tbox-php)은 읽지 못한다(L-3).
# 경로는 모두 절대 경로여야 한다(배치가 시작할 때 모양을 본다 — 틀리면 종료 코드 3).

# DB — 역할 tbox_push (D 표 권한만: 받기·대기표·users 세 칸·audit_logs INSERT)
DB_HOST=127.0.0.1
DB_PORT=5432
DB_NAME=tbox_re
DB_USER=tbox_push
PGPASSFILE=/etc/tbox-v2/push.pgpass

# VAPID 키 한 쌍 (비밀 키 tbox-push 0600 · 공개 키 root 0644 — 웹이 GET /api/admin/push/key 로 내보낸다)
VAPID_PRIVATE_KEY_FILE=/etc/tbox-v2/vapid-private.pem
VAPID_PUBLIC_KEY_FILE=/etc/tbox-v2/vapid-public.txt

# 상태(읽기 위치·대기·시간당 개수 — 받기 번호와 개수만, 0600) · 잠금 파일이 여기에
STATE_DIR=/var/lib/tbox-push

# 자기 감사 사본 (tbox-push 0640) — DB 행은 audit_logs 에 그대로 남는다(구현 기록 4, 사용자 결정 대기)
AUDIT_LOG_FILE=/var/log/tbox-push/audit.log

# 오류 기록 (tbox-push 0640) — 설정 오류·DB 연결 실패·잡히지 않은 예외(클래스·파일:줄만, 값 없음). cron 은 출력을 버린다(MAILTO="")
ERROR_LOG=/var/log/tbox-push/error.log

# 읽을 경보 줄 (root 0644 — 폴더 /var/log/tbox-v2 는 tbox-push 에게 통과(x)만)
ALERTS_LOG=/var/log/tbox-v2/alerts.log

# 하루 요약으로 보낼 규칙 (구현 기록 5 — 기본 AL-9: 오늘 사람 출처 AL-9 17건이 모두 Claude 세션의 sudo psql 이었다).
# 비우면 사람·시스템 경보는 전부 곧바로 간다(지시서 그대로). 쉼표로 이어 쓴다: DIGEST_RULES=AL-9,AL-10
# Claude 경보(origin claude-*)는 이 값과 상관없이 늘 하루 요약이다.
# AL-7 도 요약 — 2026-09-26(토) AL-7 폭주로 서버 /etc/tbox-v2/push.conf 를 AL-9,AL-7 로 바꿨다. 틀도 같게 둬 새로 설치해도(install.sh 는 없을 때만 복사) 유지된다.
DIGEST_RULES=AL-9,AL-7
