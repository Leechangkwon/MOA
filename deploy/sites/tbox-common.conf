# deploy/sites/tbox-common.conf — 모든 t-box 사이트가 함께 쓰는 http 컨텍스트 정의
#
# 설치 위치: /etc/nginx/conf.d/tbox-common.conf  (deploy/switch-site.sh 가 복사)
# 왜 conf.d 인가: nginx.conf 가 `include /etc/nginx/conf.d/*.conf;` 를 sites-enabled 보다
#   먼저 읽는다. log_format·map 은 http 컨텍스트에만 놓을 수 있고 한 번만 정의해야 하므로,
#   사이트 파일마다 넣으면 "중복 정의"로 nginx -t 가 실패한다. 반대로 공개용 파일에만 두면
#   로컬용(tbox-vN-local)만 enable 된 상태에서 참조가 깨진다. 그래서 정의는 여기 한 곳뿐이고
#   사이트 파일들은 참조만 한다.
# 이름에 tbox_ 접두어를 붙이는 이유: 다른 사이트(강사 실습 등)의 정의와 충돌하지 않게.

# 실제 접속 IP·프록시 정보를 남기는 로그 형식 (ARCH 3장 배포 메모, SECURITY R-30)
#   $remote_addr           real_ip 적용 후의 주소 = 감사 로그에 남는 IP 와 같은 값
#   $realip_remote_addr    real_ip 적용 전의 주소 = 실제 TCP 상대 (프록시면 192.168.104.100)
#   $http_x_forwarded_for  프록시가 보낸 원본 클라이언트 IP (안 보내면 "-")
#   $http_x_forwarded_proto 프록시가 알려 준 원본 스킴 (https 기대)
log_format tbox_proxy '$remote_addr "$realip_remote_addr" "$http_x_forwarded_for" "$http_x_forwarded_proto" [$time_local] "$tbox_safe_request" $status $body_bytes_sent "$tbox_safe_agent"';

# 강사 프록시가 2초마다 보내는 User-Agent 없는 `GET /` 헬스체크를 로그에서 제외한다.
# (로그가 헬스체크로 덮여 실제 공격 흔적이 묻히는 것을 막는다 — PRD S-07 취지)
map $http_user_agent $tbox_loggable {
    default 1;
    ""      0;
}

# 공개 80 포트에 **누가 TCP 로 붙었나** (SECURITY R-31, 보안 넷 2026-09-26 — 사용자 결정 d52 「넷 다 진행」)
#   사내망 어디서나 VM 80 에 직접 붙으면 프록시를 건너뛴 **평문** 로그인 화면이 나왔다(비밀번호가 평문으로 나가는 길).
#   방화벽(ufw) 없이 nginx 로 닫는다(ⓒ안): 공개용 사이트(tbox-v2.conf) 서버 블록 첫머리가 이 값이 0 이면 도메인(https)으로 301.
#   $realip_remote_addr = real_ip 적용 **전** 주소 = 실제 TCP 상대다. X-Forwarded-For 로 바꿀 수 없다(위조 불가 — R-31 실측).
#     · 192.168.104.100 — 강사 TLS 프록시(set_real_ip_from 과 같은 값 — 프록시 주소가 바뀌면 **둘 다** 고친다.
#                         이 줄만 옛 값이면 프록시로 온 요청도 301 → 도메인 → 다시 301 로 도는 고리가 된다)
#     · 127.0.0.1 · ::1 — 이 서버 자신(반영 스크립트·점검 확인 `curl http://127.0.0.1/…`, deploy/switch-site.sh)
#   그 밖(사내망 PC · VM 자기 LAN 주소 192.168.105.44 로 붙은 것 포함)은 0 이다.
#   로컬 검토 포트 8082(tbox-v2-local)·실습 8081(tbox-v1-local)은 이 값을 쓰지 않는다 — 127.0.0.1 에만 열려 있다.
#   이름에 tbox_ 접두어 — 위 머리 규칙(다른 사이트 정의와 충돌하지 않게).
map $realip_remote_addr $tbox_via_proxy {
    default          0;
    192.168.104.100  1;
    127.0.0.1        1;
    ::1              1;
}

# 인증 창구 IP 속도 제한 존 (PRD S-09-8, ARCHITECTURE 4.0 · 8장, SECURITY R-06 · R-48)
#   비밀번호나 2단계 인증 코드를 **받는 경로 다섯 곳**에 붙인다 (사이트 파일의 `location =` 블록).
#     · POST /api/login                (10단계)
#     · POST /api/me/password          (13단계 — 세션이 있어도 현재 비밀번호를 다시 묻는다)
#     · POST /api/me/mfa/enroll
#     · POST /api/me/mfa/confirm
#     · POST /api/me/mfa/disable
#   각 경로는 **끝 슬래시 변형**(`/api/login/` 처럼)도 함께 둔다 — 앱이 경로 끝의 `/` 를 떼고
#   매칭하므로, 그 블록이 없으면 슬래시 하나로 속도 제한만 우회할 수 있다(nginx 는 `//` 도 합친다).
#   13단계 이전에는 `/api/login` 하나뿐이었다. 로그인 뒤 창구는 세션만 있으면 닿으면서 비밀번호와
#   OTP 6자리를 다시 묻는데 제한이 없어, 세션 쿠키를 훔친 사람이 무제한으로 시험할 수 있었다(R-48).
#   $binary_remote_addr 는 real_ip 적용 후의 주소다 — 프록시 뒤에서도 실제 클라이언트별로 센다.
#   rate=30r/m (2초에 1회) + burst=10 nodelay: "틀린 비번 6회 → 계정 잠금" 실습이
#   429 에 먼저 걸리지 않을 만큼 넉넉하고, 무차별 대입은 분당 30회로 묶인다.
#   계정 잠금만으로는 R-06(잠금 DoS)이 남으므로 IP 제한을 함께 둔다.
#   zone=tbox_login:1m — 1MB ≈ IP 16,000개 분량의 상태.
limit_req_zone $binary_remote_addr zone=tbox_login:1m rate=30r/m;

# 공유 링크 속도 제한 존 (15-2, PRD F-13, ARCHITECTURE 5.12 「속도 제한」, SECURITY R-57)
#   `GET /s/{token}` 한 경로에만 붙인다 (사이트 파일의 `location ~ "^/s/[A-Za-z0-9_-]{43}$"`).
#   무엇을 막나: 토큰을 바꿔 가며 두드리는 **열거 시도**를 IP 단위로 늦춘다. 토큰이 32바이트
#   난수(base64url 43자)라 열거 자체가 비현실적이지만, 한 겹 더 두는 쪽이 흔적도 남는다
#   (초과 요청은 nginx error.log 에 `limiting requests … zone="tbox_share"` 로 남는다).
#   rate=60r/m (1초에 1회) + burst=10 nodelay: 사람이 링크를 눌러 받는 속도에는 걸리지 않고,
#   자동화된 연타는 분당 60회로 묶인다. 로그인(30r/m)보다 넉넉한 이유는 이 경로가
#   **정상 사용에서도 여러 번** 불릴 수 있기 때문이다(한 링크를 최대 10번까지 받는다).
#   존을 따로 둔 이유: 로그인과 같은 존을 쓰면 한쪽의 연타가 다른 쪽을 막는다(서로 다른 위협).
#   zone=tbox_share:1m — 1MB ≈ IP 16,000개 분량의 상태.
limit_req_zone $binary_remote_addr zone=tbox_share:1m rate=60r/m;

# 화면 파일 압축 (Q:F-4 P-1, 2026-09-24) — nginx.conf 는 배포판 파일이라 고치지 않고(`gzip on` 만 켜져 있다) 종류·세기만 여기서 정한다.
#   압축하는 것: CSS · JS · SVG · 웹 매니페스트 — 커뮤니티 화면 JS 약 1.2MB → 약 0.3MB.
#   **application/json 은 넣지 않는다** — 창구 응답에 CSRF 토큰이 들어 있어, 압축 길이로 비밀을 알아내는 BREACH 의 재료가 된다.
#   text/html 은 nginx 가 늘 압축한다(기본값) — 화면 HTML 에도 CSRF 토큰이 없다(토큰은 /api/me JSON 으로만 준다).
#     요청 값을 되비추는 곳(`?to=` 등)은 허용 목록의 키만 쓴다. 9-24 access.log 에서 프록시를 거친 로그인 화면이
#     이미 압축돼 나가고 있었다(6,679B → 2,740B) — HTML 은 이번 변경으로 새로 열리는 표면이 아니다.
#   gzip_proxied any — 지금 TLS 프록시는 Via 를 붙이지 않아 기본값(off)으로도 압축되지만, 프록시 설정이 바뀌어 Via 가
#     붙어도 실제 사용자에게 압축이 꺼지지 않게 둔다. gzip_vary 는 압축 대상 종류에만 `Vary: Accept-Encoding` 을 붙여
#     중간 캐시가 압축본을 못 받는 쪽에 주지 않는다(JSON 응답에는 Vary 가 없다 — 반영 스크립트가 이것으로 JSON 제외를 확인).
#   이 지시어들은 http 단이라 같은 nginx 의 tbox-v1-local(8081, 실습 사이트)에도 CSS·JS 압축과 Vary 가 생긴다 — 보존하는
#     취약점과 무관한 전송 방식이라 그대로 둔다(검토 2026-09-24 참고 항목).
#   gzip_static(미리 압축한 .gz)은 이번 범위 밖 — 효과를 본 뒤.
gzip_types text/css application/javascript text/javascript image/svg+xml application/manifest+json;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;

# 자산 캐시 기간 (Q:F-4 U-4′, 2026-09-24) — 주소에 버전(`?v=`)이 붙은 자산만 1년, 나머지는 지금처럼 7일.
#   화면이 내는 자산 주소는 전부 `?v=<파일 시각>`(app.js·app.css·화면별 CSS·editor.js·search.js) 또는 `?v=<내용 해시>`
#   (커뮤니티 부품 import — scripts/community_asset_version.php)를 단다. 내용이 바뀌면 주소가 바뀌므로 오래 두어도 옛 파일이 섞이지 않는다.
#   버전 없는 주소(생성기·매니페스트·옛 링크)와 모양이 다른 값(`?v=../x` 등)은 기본 7일.
#   사이트 파일의 `location /tbox/assets/` 는 `expires $tbox_asset_expires;` 만 쓴다 — add_header 를 새로 두지 않아
#   서버 단 보안 헤더 상속이 그대로다(immutable 은 add_header 가 필요해 뺐다 — 새로 고침 때 304 확인만 남는다).
#   tests/upgrade_smoke.sh 가 이 map 의 기본값과 정규식 → 값을 읽어 임시 서버 라우터에 넘긴다(값을 바꾸면 시험도 따라간다).
map $arg_v $tbox_asset_expires {
    default 7d;
    "~^[0-9a-z]{6,40}$" 1y;
}


# Stage 12 public addresses contain bearer capabilities: never log their path/query/UA.
map $uri $tbox_normalized_request {
    ~^/(?:mcp(?:/|\?|$)|tbox/(?:oauth/|mcp-connect|api/mcp/connections|login)) "$request_method /mcp/[REDACTED] $server_protocol";
    default $request;
    ~^/community/pub/ "$request_method /community/pub/[REDACTED] $server_protocol";
    ~^/community/memories/s/ "$request_method /community/memories/s/[REDACTED] $server_protocol";
}
map $uri $tbox_normalized_agent {
    ~^/(?:mcp(?:/|\?|$)|tbox/(?:oauth/|mcp-connect|api/mcp/connections|login)) "-";
    default $http_user_agent;
    ~^/community/pub/ "-";
    ~^/community/memories/s/ "-";
}
map $request_uri $tbox_safe_request {
    ~^/(?:mcp(?:/|\?|$)|tbox/(?:oauth/|mcp-connect|api/mcp/connections|login)) "$request_method /mcp/[REDACTED] $server_protocol";
    default $tbox_normalized_request;
    ~^/community/pub/ "$request_method /community/pub/[REDACTED] $server_protocol";
    ~^/community/memories/s/ "$request_method /community/memories/s/[REDACTED] $server_protocol";
}
map $request_uri $tbox_safe_agent {
    ~^/(?:mcp(?:/|\?|$)|tbox/(?:oauth/|mcp-connect|api/mcp/connections|login)) "-";
    default $tbox_normalized_agent;
    ~^/community/pub/ "-";
    ~^/community/memories/s/ "-";
}
limit_req_zone $binary_remote_addr zone=comm_pub:1m rate=60r/m;
limit_req_zone $binary_remote_addr zone=comm_pub_form:1m rate=5r/m;


# Desktop bridge is opt-in and limited to the messenger page (no query data).
map $request_uri $tbox_page_connect {
    default "'self'";
    ~^/tbox/messages(?:\?|$) "'self' http://127.0.0.1:43821";
}

# Separate public registration, token/consent and tool traffic buckets.
limit_req_zone $binary_remote_addr zone=tbox_mcp_register:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=tbox_mcp_oauth:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=tbox_mcp:1m rate=240r/m;
