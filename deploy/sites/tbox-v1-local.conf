# deploy/sites/tbox-v1-local.conf — v1 실습(취약) 사이트 로컬 전용 (ARCHITECTURE 3장 배포 메모)
#
# 설치 위치: /etc/nginx/sites-available/tbox-v1-local  (deploy/switch-site.sh 가 복사)
# 목적: 80 포트에 v2 가 꽂혀 있어도 실습 사이트를 계속 볼 수 있는 창구. 항상 enable 된다.
# 접속: ssh -L 8081:127.0.0.1:8081 changkwon@VM  후 http://localhost:8081/
#   127.0.0.1 로만 listen — 취약한 사이트가 사내망에 직접 노출되지 않는다.
#
# tbox-v1.conf 와 다른 점: listen 127.0.0.1:8081 하나뿐. 그 밖의 줄은 동일(취약점 보존).

server {
    listen 127.0.0.1:8081;
    server_name _;

    root /var/www/html;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    }

    # 설정·문서 파일은 웹으로 노출하지 않음
    location ~ /\.(env|git) { deny all; }
}
