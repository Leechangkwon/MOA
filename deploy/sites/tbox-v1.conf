# deploy/sites/tbox-v1.conf — v1 실습(취약) 사이트 공개용 (ARCHITECTURE 3장 배포 메모)
#
# 설치 위치: /etc/nginx/sites-available/tbox-v1  (deploy/switch-site.sh 가 복사)
# 원본: /etc/nginx/sites-available/tbox (강사 실습 설정) 를 그대로 옮긴 것.
#   listen / server_name 두 줄만 새 구조(80 포트 공개, 도메인 + 기본 서버)에 맞췄고
#   나머지 줄은 손대지 않는다 — 이 사이트는 취약점을 그대로 보존하는 것이 목적이다.
#   (root 가 /var/www/html 이고 모든 .php 를 실행한다. 의도된 상태다.)
#
# 재구축 저장소(v2)는 /var/www/tbox-v2 — 이 사이트의 웹 루트(/var/www/html) 밖이다.
# 그래서 v1 경유로 v2 의 소스·.env·SQL 에 닿는 URL 자체가 없다 (SECURITY R-29 해소).
# 예전에 그 통로를 막던 deploy/old-site-deny.conf include 는 불필요해져 제거했다.

server {
    listen 80;
    listen [::]:80;
    server_name changkwon.mso.so _;

    root /var/www/html;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    }

    # 설정·문서 파일은 웹으로 노출하지 않음
    location ~ /\.(env|git) { deny all; }
}
