# deploy/sites/tbox-v2-local.conf — v2(이 저장소) 로컬 전용 사이트 (ARCHITECTURE 3장 배포 메모)
#
# 설치 위치: /etc/nginx/sites-available/tbox-v2-local  (deploy/switch-site.sh 가 복사)
# 목적: 80 포트에 어느 버전이 꽂혀 있든 v2 를 항상 볼 수 있는 창구. 항상 enable 된다.
# 접속: ssh -L 8082:127.0.0.1:8082 changkwon@VM  후 브라우저에서 http://localhost:8082/
#   127.0.0.1 로만 listen 하므로 사내망에서도 직접 닿지 않는다 (SSH 터널 필요).
#
# tbox-v2.conf 와 다른 점 세 가지
#   · listen 127.0.0.1:8082 만 (공개 80 없음)
#   · HSTS 없음 — 평문 http://localhost:8082 를 https 로 강제하면 접속이 불가능해진다
#   · real_ip 없음 — 프록시를 거치지 않으므로 신뢰할 헤더가 없다 (여기서 XFF 를 믿으면 위조 통로)

server {
    listen 127.0.0.1:8082;
    server_name _;

    root  /var/www/qaredi/tbox-v2/public;            # ★ public/ 만 노출
    index index.php;

    charset utf-8;
    server_tokens off;

    # PRD S-06 — 100MB 정확 경계는 PHP Upload::MAX_BYTES (ARCH 8장 6단계 결정 2026-09-11).
    # nginx 는 multipart 오버헤드를 감안해 101m 으로 받고, 101MB 파일은 여기서 413 이다.
    client_max_body_size 101m;

    # ─── F-49: 413 도 JSON 으로 (PRD F-49 ④, ARCH 4.2 「오류 문구 정책」) ───
    # 공개용 tbox-v2.conf 와 **같은 내용**이다. 여기에도 두는 이유: 검토(T-61 (e))는 이 포트
    # 8082 로 하는데, 이 블록이 공개용에만 있으면 "JSON 413 이 나오나" 를 검토에서 실측할
    # 길이 없다 — 설정이 갈라지면 시험한 것과 배포된 것이 다른 물건이 된다.
    # 100MB 초과는 nginx 가 PHP 앞에서 끊으므로 앱이 응답 모양을 정할 수 없다. 기본 413 은
    # HTML 이고, 프로그램용 업로드 API 의 계약은 "실패는 언제나 {"error": …}" 이다.
    # 본문은 **고정 문자열**이며 요청 값이 한 글자도 섞이지 않는다.
    # `=` 를 붙여 상태 코드를 413 그대로 유지한다(붙이지 않으면 명명 위치의 코드로 바뀐다).
    error_page 413 = @json413;
    location @json413 {
        default_type application/json;
        return 413 '{"error":"파일이 100MB 를 넘습니다"}';
    }

    # 로그 형식 정의는 conf.d/tbox-common.conf. 로컬 포트에는 헬스체크가 오지 않으므로 if= 없이 전부 남긴다.
    access_log /var/log/nginx/tbox-v2-local.access.log tbox_proxy;
    error_log  /var/log/nginx/tbox-v2-local.error.log;

    # ─── 보안 헤더 4개 (PRD S-09-9). HSTS 는 위 주석대로 제외 ───
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location ~ /\. { return 404; }

    # F-17 오프라인 2단계 코드 생성기 — 이 파일 하나만 인라인 스크립트·스타일을 허용한다.
    #   서버 전역 CSP(script-src 'self')는 인라인을 막아 이 파일이 "문서처럼만" 보이게 했다(2026-09-11 사용자 관찰).
    #   파일은 외부 참조 0·서버 요청 0 인 자체 완결 도구라 default-src 'none' 으로 더 좁힌다. 다른 경로에는 영향 없음.
    #   nginx 는 location 안에 add_header 가 하나라도 있으면 상위 헤더를 물려받지 않으므로 보안 헤더를 전부 다시 적는다.
    location = /tbox/assets/totp-generator.html {
        # Qaredi C — 주소만 /tbox 아래로 옮기고 파일은 alias 로 가리킨다. CSP 문자열 무변경.
        alias /var/www/qaredi/tbox-v2/public/assets/totp-generator.html;
        expires 1h;
        access_log off;
        # F-46 — 웹 매니페스트(홈 화면에 추가)를 읽을 수 있게 manifest-src 'self' 한 칸 (라이브 conf 와 같음)
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # F-46 — 생성기의 웹 매니페스트. 라이브 conf(tbox-v2.conf)와 같은 location (HSTS 만 없음 — 검토 포트는 http)
    location = /tbox/assets/totp-generator.webmanifest {
        # Qaredi C — 주소만 /tbox 아래로. 매니페스트의 start_url·scope 도 /tbox/assets/ 다.
        alias /var/www/qaredi/tbox-v2/public/assets/totp-generator.webmanifest;
        expires 1h;
        access_log off;
        types { application/manifest+json webmanifest; }
        add_header Content-Security-Policy "default-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Qaredi C — 자산은 /tbox/assets/ 한 곳에서만 서비스한다 (캐시·헤더는 전과 같다).
    location /tbox/assets/ {
        alias /var/www/qaredi/tbox-v2/public/assets/;
        # `try_files` 를 두지 않는다 — alias 와 함께 쓰면 nginx 가 경로를 어긋나게 잇는
        # 오래된 결함이 있다. 없어도 동작은 같다: 파일이 없으면 이 블록이 그대로 404 다.
        expires $tbox_asset_expires;   # 버전 붙은 주소 1년 · 나머지 7일 — map 은 conf.d/tbox-common.conf (Q:F-4 U-4′)
        access_log off;
    }

    # 옛 자산 주소는 **308 만** 한다 — 같은 파일을 두 주소로 서비스하지 않는다.
    # PHP 에는 자산 라우트가 없으므로(단일 입구는 index.php) 여기서 nginx 가 답한다.
    location /assets/ {
        # `absolute_redirect off` 가 없으면 nginx 가 기본값(on)대로 스킴·호스트를 붙여
        # `http://<호스트>/tbox/…` 라는 **절대 주소**를 Location 에 넣는다. 이 서버는 TLS 프록시
        # 뒤에 있어 그 스킴이 `http` 로 찍히고, 브라우저는 https 화면에서 http 로 내려가는
        # 주소를 받게 된다(실측 2026-09-22 관문 ②). 상대 경로로 내보내면 스킴·호스트는
        # 브라우저가 지금 주소에서 그대로 이어 쓴다 — PHP 쪽 308 과 같은 모양이 된다.
        absolute_redirect off;
        return 308 /tbox$request_uri;
    }

    # 옛 헬스 주소도 nginx 가 **308 만** 한다 (Q:F-4 P-5b, 2026-09-24) — 사용자 모니터 프로그램이 하루 약 7,500번 부르는데,
    # PHP 가 답하면 그때마다 워커를 쓰고 DB 에 붙은 뒤 308 을 주었다. 쿼리는 $request_uri 그대로 붙는다(Q:T-3 과 같은 모양 · POST 도 처리 0).
    # 모니터 프로그램의 주소를 /tbox/api/health 로 바꾸는 것은 사용자 PC 쪽 설정이다.
    location = /api/health {
        absolute_redirect off;
        return 308 /tbox$request_uri;
    }

    location /protected/ {
        internal;
        alias /var/lib/tbox-v2/storage/;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # ─── 로그인 IP 속도 제한 (PRD S-09-8, ARCHITECTURE 4.0 · 8장, SECURITY R-06) ───
    # zone 정의는 conf.d/tbox-common.conf (http 컨텍스트). 초과 요청은 429.
    # 이 location 은 `try_files` 를 거치지 않고 바로 PHP 로 간다 — 그래도 REQUEST_URI 가
    # /api/login 그대로 전달되므로 Http::path() 가 같은 경로를 보고 라우트가 매칭된다.
    # `= /api/login/` 을 함께 둔 이유: 앱이 경로 끝의 `/` 를 떼고 매칭하므로,
    # 이 블록이 없으면 `/api/login/` 로 속도 제한만 우회할 수 있다(nginx 는 `//` 도 여기로 합친다).
    location = /tbox/api/login {
        limit_req zone=tbox_login burst=10 nodelay;
        limit_req_status 429;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_hide_header X-Powered-By;
    }
    location = /tbox/api/login/ {
        limit_req zone=tbox_login burst=10 nodelay;
        limit_req_status 429;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_hide_header X-Powered-By;
    }

    # ─── 로그인 **뒤** 비밀번호·2단계 인증 창구에도 같은 속도 제한 (13단계 — SECURITY R-48, PRD T-30) ───
    # 이 네 경로는 세션만 있으면 닿을 수 있으면서 비밀번호·OTP 6자리를 다시 묻는다. 앱 쪽에는
    # 13단계에서 실패 집계·잠금(Auth::countFailure, 5회 → 10분 + 세션 회수)을 넣었고, 그 앞에
    # IP 단위 속도 제한을 한 겹 더 둔다 — 계정이 잠기기 전에 초당 수십 번을 던지는 것을 막는다.
    # zone·burst 값은 `/api/login` 과 같다(conf.d/tbox-common.conf 의 tbox_login, 30r/m).
    # 끝 슬래시 변형을 함께 둔 이유도 같다: 앱이 경로 끝의 `/` 를 떼고 매칭하므로 이 블록이
    # 없으면 `/api/me/password/` 로 속도 제한만 우회할 수 있다.
    location = /tbox/api/me/password {
        limit_req zone=tbox_login burst=10 nodelay;
        limit_req_status 429;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_hide_header X-Powered-By;
    }
    location = /tbox/api/me/password/ {
        limit_req zone=tbox_login burst=10 nodelay;
        limit_req_status 429;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_hide_header X-Powered-By;
    }
    location = /tbox/api/me/mfa/enroll {
        limit_req zone=tbox_login burst=10 nodelay;
        limit_req_status 429;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_hide_header X-Powered-By;
    }
    location = /tbox/api/me/mfa/enroll/ {
        limit_req zone=tbox_login burst=10 nodelay;
        limit_req_status 429;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_hide_header X-Powered-By;
    }
    location = /tbox/api/me/mfa/confirm {
        limit_req zone=tbox_login burst=10 nodelay;
        limit_req_status 429;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_hide_header X-Powered-By;
    }
    location = /tbox/api/me/mfa/confirm/ {
        limit_req zone=tbox_login burst=10 nodelay;
        limit_req_status 429;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_hide_header X-Powered-By;
    }
    location = /tbox/api/me/mfa/disable {
        limit_req zone=tbox_login burst=10 nodelay;
        limit_req_status 429;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_hide_header X-Powered-By;
    }
    location = /tbox/api/me/mfa/disable/ {
        limit_req zone=tbox_login burst=10 nodelay;
        limit_req_status 429;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_hide_header X-Powered-By;
    }

    # ─── 16-1 관리 기능 재인증 창구에도 같은 속도 제한 (PRD F-23, SECURITY R-59) ───
    # `/api/me/reauth` 는 세션만 있으면 닿으면서 **현재 비밀번호를 다시 받는다** — 훔친 쿠키를
    # 쥔 사람에게는 비밀번호를 시험할 수 있는 창구다. 앱 쪽에는 실패 집계·잠금·세션 회수
    # (Auth::countFailureAndRevoke, 5회 → 10분)가 있고, 그 앞에 IP 단위 속도 제한을 한 겹 더 둔다.
    # zone·burst 값과 끝 슬래시 변형을 함께 두는 이유는 위 네 경로(13단계)와 같다.
    location = /tbox/api/me/reauth {
        limit_req zone=tbox_login burst=10 nodelay;
        limit_req_status 429;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_hide_header X-Powered-By;
    }
    location = /tbox/api/me/reauth/ {
        limit_req zone=tbox_login burst=10 nodelay;
        limit_req_status 429;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_hide_header X-Powered-By;
    }

    # ─── 12-2 미리보기 원본(inline) 경로 — 프레임 허용은 이 경로만 (PRD F-18, ARCH 5.8, SECURITY R-41) ───
    # 응답의 CSP 는 PHP(Storage::streamInline)가 보내는 `sandbox; default-src 'none'; frame-ancestors 'self'` 하나다.
    # nginx 는 location 안에 add_header 가 있으면 상위 헤더(CSP frame-ancestors 'none' · X-Frame-Options DENY)를
    # 물려주지 않으므로, 여기서는 프레임을 막지 않는 헤더만 다시 적는다. 같은 출처(t-box 화면)의
    # <iframe sandbox> 만 이 응답을 끼울 수 있고, 다른 사이트는 frame-ancestors 'self' 가 막는다.
    # sandbox 는 문서 안 스크립트·폼·같은 출처 접근을 전부 끈다.
    # 정규식 location 은 `location /` 접두 매칭보다 우선하므로 이 블록이 raw 요청을 먼저 잡는다.
    # SCRIPT_FILENAME 을 index.php 로 고정하는 것은 `= /api/login` 과 같은 방식이며,
    # REQUEST_URI 는 그대로 전달되므로 라우터(Http::path)가 같은 경로를 본다.
    # 정규식에 `{36}` 처럼 중괄호가 들어가면 nginx 가 블록 괄호로 읽으므로 **따옴표로 감싼다**
    # (따옴표가 없으면 `nginx -t` 가 `unknown directive "36}/preview/raw$"` 로 실패한다 — 2026-09-12 실측).
    location ~ "^/tbox/api/files/[0-9a-f-]{36}/preview/raw$" {
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # ─── 15-2 공유 링크 받기 — 속도 제한 (PRD F-13, ARCH 5.12, SECURITY R-57) ───
    # zone 정의는 conf.d/tbox-common.conf (http 컨텍스트). 초과 요청은 429.
    # 정규식은 라우터의 자리표시자 `{token}`(`[A-Za-z0-9_-]{43}`)과 **같은 값**이다 —
    # 형태가 다른 요청은 여기 걸리지 않고 `location /` 로 가 앱에서 404 가 된다.
    # 정규식에 `{43}` 처럼 중괄호가 들어가면 nginx 가 블록 괄호로 읽으므로 **따옴표로 감싼다**
    # (12-2 의 preview/raw 블록과 같은 이유).
    # ★ 이 블록에는 add_header 를 **하나도 두지 않는다** — nginx 는 location 안에 add_header 가
    #   하나라도 있으면 상위(server)의 보안 헤더 4개를 물려주지 않는다. 공유 다운로드도
    #   다른 응답과 똑같은 CSP·nosniff·DENY·no-referrer 를 받아야 한다.
    location ~ "^/tbox/s/[A-Za-z0-9_-]{43}$" {
        limit_req zone=tbox_share burst=10 nodelay;
        limit_req_status 429;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }


    # ─── 17-1 관리자 영역을 관리망에서만 (PRD F-24 「네트워크 겹」, ARCH 5.14, SECURITY R-61) ───
    #
    # ★ 기본은 **꺼짐**이다. 아래 두 블록은 주석이며, 이 파일의 활성 설정은 17단계에서
    #   한 줄도 바뀌지 않았다. 켜는 것은 사용자 결정이다.
    #
    # 왜 꺼 두나: 이 서비스의 접속 출처가 셋이다 — 사내망 두 대역과 프록시 경유 외부.
    # 자기 출처가 allow 목록에 없는 채로 켜면 **관리자 자신이 관리자 영역에서 잠긴다**
    # (hardening.sh 8.4-16 의 관리망 기본값 결함과 똑같은 함정).
    # ★ 이 파일(로컬 전용)은 127.0.0.1:8082 만 받는다 — 여기로 오는 요청의 출처는 언제나
    #   127.0.0.1 이므로, 켠다면 `allow 127.0.0.1;` 이다. 공개용(tbox-v2.conf)에서는 프록시가
    #   복원한 실제 IP 가 기준이며 프록시 IP 를 적으면 안 된다 — 그쪽 파일의 같은 주석 참고.
    #
    # 켜는 법 (README 「관리자 영역을 관리망에서만(선택, 기본 꺼짐)」 절)
    #   ① 지금 내 출처를 먼저 확인한다:
    #        sudo tail -n 50 /var/log/nginx/tbox-v2-local.access.log      ← 첫 칸이 출처 IP
    #   ② 그 대역을 allow 에 적는다(여러 줄 가능). deny all 은 마지막에 그대로 둔다.
    #   ③ 주석을 풀고  sudo nginx -t  →  sudo systemctl reload nginx
    #   ④ **다른 창을 열어 둔 채** /admin 접속을 확인한다. 잠기면 ③을 되돌린다.
    # 막는 순서: nginx(여기) → 라우트 정책 role:Admin → 재인증 15분 창. 이 블록을 켜지
    # 않아도 뒤의 두 겹은 그대로 동작한다 (SECURITY R-61).
    #
    # location ^~ /tbox/admin {
    #     allow 127.0.0.1;            # ← 이 파일은 로컬 전용 (공개용은 관리망 대역)
    #     deny  all;
    #     include       fastcgi_params;
    #     fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    #     fastcgi_param HTTPS on;
    #     fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
    #     fastcgi_read_timeout 60s;
    #     fastcgi_hide_header X-Powered-By;
    # }
    # location ^~ /tbox/api/admin {
    #     allow 127.0.0.1;
    #     deny  all;
    #     include       fastcgi_params;
    #     fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    #     fastcgi_param HTTPS on;
    #     fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
    #     fastcgi_read_timeout 60s;
    #     fastcgi_hide_header X-Powered-By;
    # }

    location = /index.php {
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # 공개용과 같은 값으로 둔다 — 세션 쿠키(Secure) 동작을 공개 경로와 동일하게 재현해야
        # "로컬에서는 되는데 공개에서는 안 된다" 는 차이가 생기지 않는다.
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ { return 404; }
}
