# deploy/sites/tbox-v2-local.conf — v2(이 저장소) 로컬 전용 사이트 (ARCHITECTURE 3장 배포 메모)
#
# 설치 위치: /etc/nginx/sites-available/tbox-v2-local  (deploy/switch-site.sh 가 복사)
# 목적: 80 포트에 어느 버전이 꽂혀 있든 v2 를 항상 볼 수 있는 창구. 항상 enable 된다.
# 접속: ssh -L 8082:127.0.0.1:8082 changkwon@VM  후 브라우저에서 http://localhost:8082/
#   127.0.0.1 로만 listen 하므로 사내망에서도 직접 닿지 않는다 (SSH 터널 필요).
#
# tbox-v2.conf 와 다른 점 세 가지
#   · listen 127.0.0.1:8082 만 (공개 80 없음)
#   · HSTS 없음 — 평문 http://localhost:8082 를 https 로 강제하면 접속이 불가능해진다
#   · real_ip 없음 — 프록시를 거치지 않으므로 신뢰할 헤더가 없다 (여기서 XFF 를 믿으면 위조 통로)

server {
    listen 127.0.0.1:8082;
    server_name _;

    root  /var/www/tbox-v2/public;            # ★ public/ 만 노출
    index index.php;

    charset utf-8;
    server_tokens off;

    # PRD S-06 — 100MB 정확 경계는 PHP Upload::MAX_BYTES (ARCH 8장 6단계 결정 2026-09-11).
    # nginx 는 multipart 오버헤드를 감안해 101m 으로 받고, 101MB 파일은 여기서 413 이다.
    client_max_body_size 101m;

    # 로그 형식 정의는 conf.d/tbox-common.conf. 로컬 포트에는 헬스체크가 오지 않으므로 if= 없이 전부 남긴다.
    access_log /var/log/nginx/tbox-v2-local.access.log tbox_proxy;
    error_log  /var/log/nginx/tbox-v2-local.error.log;

    # ─── 보안 헤더 4개 (PRD S-09-9). HSTS 는 위 주석대로 제외 ───
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location ~ /\. { return 404; }

    # F-17 오프라인 2단계 코드 생성기 — 이 파일 하나만 인라인 스크립트·스타일을 허용한다.
    #   서버 전역 CSP(script-src 'self')는 인라인을 막아 이 파일이 "문서처럼만" 보이게 했다(2026-09-11 사용자 관찰).
    #   파일은 외부 참조 0·서버 요청 0 인 자체 완결 도구라 default-src 'none' 으로 더 좁힌다. 다른 경로에는 영향 없음.
    #   nginx 는 location 안에 add_header 가 하나라도 있으면 상위 헤더를 물려받지 않으므로 보안 헤더를 전부 다시 적는다.
    location = /assets/totp-generator.html {
        try_files $uri =404;
        expires 1h;
        access_log off;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location /protected/ {
        internal;
        alias /var/lib/tbox-v2/storage/;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # ─── 로그인 IP 속도 제한 (PRD S-09-8, ARCHITECTURE 4.0 · 8장, SECURITY R-06) ───
    # zone 정의는 conf.d/tbox-common.conf (http 컨텍스트). 초과 요청은 429.
    # 이 location 은 `try_files` 를 거치지 않고 바로 PHP 로 간다 — 그래도 REQUEST_URI 가
    # /api/login 그대로 전달되므로 Http::path() 가 같은 경로를 보고 라우트가 매칭된다.
    # `= /api/login/` 을 함께 둔 이유: 앱이 경로 끝의 `/` 를 떼고 매칭하므로,
    # 이 블록이 없으면 `/api/login/` 로 속도 제한만 우회할 수 있다(nginx 는 `//` 도 여기로 합친다).
    location = /api/login {
        limit_req zone=tbox_login burst=10 nodelay;
        limit_req_status 429;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_hide_header X-Powered-By;
    }
    location = /api/login/ {
        limit_req zone=tbox_login burst=10 nodelay;
        limit_req_status 429;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_hide_header X-Powered-By;
    }

    # ─── 12-2 미리보기 원본(inline) 경로 — 프레임 허용은 이 경로만 (PRD F-18, ARCH 5.8, SECURITY R-41) ───
    # 응답의 CSP 는 PHP(Storage::streamInline)가 보내는 `sandbox; default-src 'none'; frame-ancestors 'self'` 하나다.
    # nginx 는 location 안에 add_header 가 있으면 상위 헤더(CSP frame-ancestors 'none' · X-Frame-Options DENY)를
    # 물려주지 않으므로, 여기서는 프레임을 막지 않는 헤더만 다시 적는다. 같은 출처(t-box 화면)의
    # <iframe sandbox> 만 이 응답을 끼울 수 있고, 다른 사이트는 frame-ancestors 'self' 가 막는다.
    # sandbox 는 문서 안 스크립트·폼·같은 출처 접근을 전부 끈다.
    # 정규식 location 은 `location /` 접두 매칭보다 우선하므로 이 블록이 raw 요청을 먼저 잡는다.
    # SCRIPT_FILENAME 을 index.php 로 고정하는 것은 `= /api/login` 과 같은 방식이며,
    # REQUEST_URI 는 그대로 전달되므로 라우터(Http::path)가 같은 경로를 본다.
    # 정규식에 `{36}` 처럼 중괄호가 들어가면 nginx 가 블록 괄호로 읽으므로 **따옴표로 감싼다**
    # (따옴표가 없으면 `nginx -t` 가 `unknown directive "36}/preview/raw$"` 로 실패한다 — 2026-09-12 실측).
    location ~ "^/api/files/[0-9a-f-]{36}/preview/raw$" {
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /index.php {
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # 공개용과 같은 값으로 둔다 — 세션 쿠키(Secure) 동작을 공개 경로와 동일하게 재현해야
        # "로컬에서는 되는데 공개에서는 안 된다" 는 차이가 생기지 않는다.
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ { return 404; }
}
