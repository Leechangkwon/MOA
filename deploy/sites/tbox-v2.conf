# deploy/sites/tbox-v2.conf — v2(이 저장소) 공개용 사이트 (ARCHITECTURE 3장 배포 메모 · 8장)
#
# 설치 위치: /etc/nginx/sites-available/tbox-v2  (deploy/switch-site.sh 가 복사)
# 공개 경로: 브라우저 ──https──▶ 강사 리버스 프록시(changkwon.mso.so, TLS 종단, http→https 301)
#                        └──http──▶ 이 VM 의 80 포트 (프록시 내부 IP 192.168.104.100)
#
# 그러므로 이 파일에는 TLS 가 없다. VM 은 TLS 를 하지 않고 80 만 받는다 (S-09-1 은 프록시가 충족).
# 80 포트에는 한 번에 한 버전만 꽂힌다 — `sudo bash deploy/switch-site.sh v2` 로 고른다.
#
# 저장소는 /var/www/qaredi/tbox-v2 — v1 웹 루트(/var/www/html) 밖이다. 그러므로 v1 경유로
# 이 저장소의 소스·.env·SQL 에 닿는 URL 자체가 없다 (SECURITY R-29 해소).

# ─── 디버깅 묶음 S2 제안(검토 반영 — 반영은 사용자 결정): 로그인 뒤 **비밀 창구** 전용 속도 제한 zone ───
# 이 파일은 http 컨텍스트 안에 include 되므로 server 밖 맨 위의 map·limit_req_zone 은 http 단 선언이다(conf.d 를 바꾸지 않는다).
# 키가 빈 문자열이면 limit_req 가 세지 않는다 — GET·HEAD(토큰 목록·권한 표·호스트 목록을 여는 것)는 **세지 않고**,
# 비밀번호·코드를 싣는 쓰기(POST·PATCH)만 IP 단위로 센다. 로그인 zone(tbox_login)과 **다른 버킷**이라 화면을 여는 GET 이
# 로그인 시도 몫을 먹지 않고, 이 창구들의 추측이 로그인 몫을 먹지도 않는다. 값은 로그인과 같다(30r/m · burst 10).
map $request_method $tbox_secret_limit_key {
    GET     "";
    HEAD    "";
    default $binary_remote_addr;
}
limit_req_zone $tbox_secret_limit_key zone=tbox_secret:1m rate=30r/m;

server {
    listen              80 default_server;
    listen              [::]:80 default_server;
    server_name         changkwon.mso.so _;

    # ─── 프록시를 건너뛴 직접 접속은 도메인(https)으로 (SECURITY R-31, 보안 넷 2026-09-26) ───
    # 사내망에서 VM 80 에 직접 붙으면 평문 로그인 화면이 나와 비밀번호가 평문으로 나갈 수 있었다.
    # TCP 상대가 프록시·이 서버 자신이 아니면($tbox_via_proxy = 0, map 은 conf.d/tbox-common.conf) 어떤 경로든
    # 화면을 주지 않고 https 도메인으로 보낸다. 서버 단 rewrite 단계라 아래 모든 location(로그인 속도 제한·
    # 미리보기·공유 링크·단일 입구)보다 먼저 돈다. `if` 안에 `return` 하나뿐인 모양은 nginx 가 안전하다고 적어 둔 쓰임이다.
    # $request_uri 는 경로+쿼리만(요청 줄이 `GET http://다른호스트/…` 여도 호스트는 붙지 않는다) — 늘 이 도메인 안으로만 간다.
    if ($tbox_via_proxy = 0) {
        return 301 https://changkwon.mso.so$request_uri;
    }

    # ─── 실제 접속 IP 복원 (ARCH 3장, SECURITY R-30 · R-31) ───
    # 프록시 IP(192.168.104.100)가 보낸 X-Forwarded-For 만 신뢰한다.
    # 사내망 다른 곳에서 VM 80 에 직접 붙어 XFF 를 위조해도 그 헤더는 무시된다(R-31).
    # real_ip_recursive off — 체인의 마지막(프록시가 붙인) 값 하나만 쓰고 거슬러 올라가지 않는다.
    set_real_ip_from    192.168.104.100;
    real_ip_header      X-Forwarded-For;
    real_ip_recursive   off;

    root  /var/www/qaredi/tbox-v2/public;            # ★ public/ 만 노출 — src/·db/·deploy/·.env 는 URL 에 없다
    index index.php;

    charset utf-8;

    # 서버 종류·버전 숨김 (정찰 정보 최소화)
    server_tokens off;

    # PRD S-06: 100MB 초과는 앱에 닿기 전 413.
    # 6단계 결정(2026-09-11, ARCH 8장): 100m 이면 multipart 오버헤드 때문에 정확히 100MB 파일까지
    # 413 이 된다(3단계 재검토 실측). nginx 는 101m 으로 요청 전체를 받고, 정확한 100MB
    # (104,857,600 B) 경계는 PHP Upload::MAX_BYTES 가 판정한다. 101MB 파일은 여전히 nginx 413.
    client_max_body_size 101m;

    # ─── F-49: 413 도 JSON 으로 (PRD F-49 ④, ARCH 4.2 「오류 문구 정책」) ───
    # 100MB 초과는 nginx 가 PHP 앞에서 끊으므로 앱이 응답 모양을 정할 수 없다. 기본 413 은
    # HTML(`<html><head><title>413 …`)이고, 프로그램용 업로드 API 의 계약은 "실패는 언제나
    # {"error": …}" 이다 — 그래서 여기서 같은 모양으로 맞춘다. 본문은 **고정 문자열**이며
    # 요청 값이 한 글자도 섞이지 않는다(요청 크기·파일 이름 따위를 되돌려 주지 않는다).
    # `=` 를 붙여 상태 코드를 413 그대로 유지한다(붙이지 않으면 명명 위치의 코드로 바뀐다).
    # 이 블록은 업로드뿐 아니라 이 서버의 모든 413 에 적용된다 — 큰 본문을 보낸 요청은
    # 어느 창구든 같은 모양으로 거절되는 편이 부르는 쪽에 일관적이다.
    error_page 413 = @json413;
    location @json413 {
        default_type application/json;
        return 413 '{"error":"파일이 100MB 를 넘습니다"}';
    }

    # UA 없는 프록시 헬스체크(2초 간격)는 로그에 남기지 않는다. 형식 정의는 conf.d/tbox-common.conf
    access_log /var/log/nginx/tbox-v2.access.log tbox_proxy if=$tbox_loggable;
    error_log  /var/log/nginx/tbox-v2.error.log;

    # ─── 보안 헤더 (PRD S-09-9) + HSTS (PRD S-09-1, SECURITY R-28) ───
    # PHP(src/bootstrap.php)에서도 같은 헤더를 붙인다 — 어느 한쪽 설정이 빠져도 남는다.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # HSTS 는 공개용(이 파일)에만. 브라우저는 프록시를 통해 항상 https 로 보므로 유효하다.
    # 로컬용(tbox-v2-local, 127.0.0.1:8082 평문)에는 넣지 않는다 — localhost 를 https 로 강제하면 못 본다.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ─── 숨김 파일(.env, .git, .htaccess …) ───
    # ARCH 8장은 `deny all`(403) 이지만, PRD 13장 1단계 통과 기준이 "전부 404" 이므로 404 로 맞춘다.
    # 403 은 "있지만 막혔다" 를 알려 주는 정보다. 404 는 존재 여부 자체를 숨긴다 (PRD S-09-5 취지).
    location ~ /\. { return 404; }

    # ─── 정적 파일 ───
    # F-17 2단계 코드 생성기 — 이 파일 하나만 인라인 스크립트·스타일을 허용한다.
    #   서버 전역 CSP(script-src 'self')는 인라인을 막아 이 파일이 "문서처럼만" 보이게 했다(2026-09-11 사용자 관찰).
    #   파일은 외부 참조 0 인 자체 완결 도구라 default-src 'none' 으로 더 좁힌다. 다른 경로에는 영향 없음.
    #   F-42 — 시계를 맞추려고 이 서버의 `/api/time` 하나만 부르므로 `connect-src 'self'` 를 더한다.
    #   'self' 라서 다른 곳으로는 아무것도 보낼 수 없다(비밀 키가 새는 경로를 만들지 않는다).
    #   nginx 는 location 안에 add_header 가 하나라도 있으면 상위 헤더를 물려받지 않으므로 보안 헤더를 전부 다시 적는다.
    #   F-46 — 휴대폰에서 「홈 화면에 추가」로 쓰려면 웹 매니페스트를 읽어야 한다. `default-src 'none'`
    #   아래에서는 manifest 도 막히므로 `manifest-src 'self'` 한 칸을 더한다(같은 서버의 파일 하나뿐).
    location = /tbox/assets/totp-generator.html {
        # Qaredi C — 주소만 /tbox 아래로 옮기고 파일은 alias 로 가리킨다. CSP 문자열 무변경.
        alias /var/www/qaredi/tbox-v2/public/assets/totp-generator.html;
        expires 1h;
        access_log off;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # F-46 — 생성기의 웹 매니페스트(홈 화면에 추가). 정적 파일 하나이고 로그인이 필요 없다
    #   (생성기와 같은 성격). 아이콘은 파일 안에 data: SVG 로 들어 있어 **외부 참조가 0** 이다.
    #   nginx 는 location 안에 add_header 가 하나라도 있으면 상위 헤더를 물려받지 않으므로
    #   생성기 location 과 같은 보안 헤더를 다시 적는다.
    location = /tbox/assets/totp-generator.webmanifest {
        # Qaredi C — 주소만 /tbox 아래로. 매니페스트의 start_url·scope 도 /tbox/assets/ 다.
        alias /var/www/qaredi/tbox-v2/public/assets/totp-generator.webmanifest;
        expires 1h;
        access_log off;
        # mime.types 에 `webmanifest` 항목이 없어(nginx 1.18) 이 한 줄이 Content-Type 을 정한다.
        # `add_header Content-Type` 을 쓰면 헤더가 **두 줄**이 되므로 쓰지 않는다.
        types { application/manifest+json webmanifest; }
        add_header Content-Security-Policy "default-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Qaredi C — 자산은 /tbox/assets/ 한 곳에서만 서비스한다 (캐시·헤더는 전과 같다).
    location /tbox/assets/ {
        alias /var/www/qaredi/tbox-v2/public/assets/;
        # `try_files` 를 두지 않는다 — alias 와 함께 쓰면 nginx 가 경로를 어긋나게 잇는
        # 오래된 결함이 있다. 없어도 동작은 같다: 파일이 없으면 이 블록이 그대로 404 다.
        expires $tbox_asset_expires;   # 버전 붙은 주소 1년 · 나머지 7일 — map 은 conf.d/tbox-common.conf (Q:F-4 U-4′)
        access_log off;
    }

    # 옛 자산 주소는 **308 만** 한다 — 같은 파일을 두 주소로 서비스하지 않는다.
    # PHP 에는 자산 라우트가 없으므로(단일 입구는 index.php) 여기서 nginx 가 답한다.
    location /assets/ {
        # `absolute_redirect off` 가 없으면 nginx 가 기본값(on)대로 스킴·호스트를 붙여
        # `http://<호스트>/tbox/…` 라는 **절대 주소**를 Location 에 넣는다. 이 서버는 TLS 프록시
        # 뒤에 있어 그 스킴이 `http` 로 찍히고, 브라우저는 https 화면에서 http 로 내려가는
        # 주소를 받게 된다(실측 2026-09-22 관문 ②). 상대 경로로 내보내면 스킴·호스트는
        # 브라우저가 지금 주소에서 그대로 이어 쓴다 — PHP 쪽 308 과 같은 모양이 된다.
        absolute_redirect off;
        return 308 /tbox$request_uri;
    }

    # 옛 헬스 주소도 nginx 가 **308 만** 한다 (Q:F-4 P-5b, 2026-09-24) — 사용자 모니터 프로그램이 하루 약 7,500번 부르는데,
    # PHP 가 답하면 그때마다 워커를 쓰고 DB 에 붙은 뒤 308 을 주었다. 쿼리는 $request_uri 그대로 붙는다(Q:T-3 과 같은 모양 · POST 도 처리 0).
    # 모니터 프로그램의 주소를 /tbox/api/health 로 바꾸는 것은 사용자 PC 쪽 설정이다.
    location = /api/health {
        absolute_redirect off;
        return 308 /tbox$request_uri;
    }

    # ─── 다운로드 가속: PHP 가 권한 확인 후 X-Accel-Redirect 로 넘기는 내부 경로 ───
    # internal 이므로 외부에서 /protected/... 를 직접 요청하면 404 다 (T-10).
    location /protected/ {
        internal;
        alias /var/lib/tbox-v2/storage/;
    }

    # ─── 나머지는 전부 index.php 로 (단일 입구) ───
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # ─── 로그인 IP 속도 제한 (PRD S-09-8, ARCHITECTURE 4.0 · 8장, SECURITY R-06) ───
    # zone 정의는 conf.d/tbox-common.conf (http 컨텍스트). 초과 요청은 429.
    # 이 location 은 `try_files` 를 거치지 않고 바로 PHP 로 간다 — 그래도 REQUEST_URI 가
    # /api/login 그대로 전달되므로 Http::path() 가 같은 경로를 보고 라우트가 매칭된다.
    # `= /api/login/` 을 함께 둔 이유: 앱이 경로 끝의 `/` 를 떼고 매칭하므로,
    # 이 블록이 없으면 `/api/login/` 로 속도 제한만 우회할 수 있다(nginx 는 `//` 도 여기로 합친다).
    location = /tbox/api/login {
        limit_req zone=tbox_login burst=10 nodelay;
        limit_req_status 429;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_hide_header X-Powered-By;
    }
    location = /tbox/api/login/ {
        limit_req zone=tbox_login burst=10 nodelay;
        limit_req_status 429;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_hide_header X-Powered-By;
    }

    # Q:F-9 — 1회용 로그인 링크: 쿼리(code)를 접근 로그에 남기지 않고, 로그인과 같은 속도 제한
    location = /tbox/session/open {
        access_log off;
        limit_req zone=tbox_login burst=10 nodelay;
        limit_req_status 429;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_hide_header X-Powered-By;
    }

    # ─── 로그인 **뒤** 비밀번호·2단계 인증 창구에도 같은 속도 제한 (13단계 — SECURITY R-48, PRD T-30) ───
    # 이 네 경로는 세션만 있으면 닿을 수 있으면서 비밀번호·OTP 6자리를 다시 묻는다. 앱 쪽에는
    # 13단계에서 실패 집계·잠금(Auth::countFailure, 5회 → 10분 + 세션 회수)을 넣었고, 그 앞에
    # IP 단위 속도 제한을 한 겹 더 둔다 — 계정이 잠기기 전에 초당 수십 번을 던지는 것을 막는다.
    # zone·burst 값은 `/api/login` 과 같다(conf.d/tbox-common.conf 의 tbox_login, 30r/m).
    # 끝 슬래시 변형을 함께 둔 이유도 같다: 앱이 경로 끝의 `/` 를 떼고 매칭하므로 이 블록이
    # 없으면 `/api/me/password/` 로 속도 제한만 우회할 수 있다.
    location = /tbox/api/me/password {
        limit_req zone=tbox_login burst=10 nodelay;
        limit_req_status 429;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_hide_header X-Powered-By;
    }
    location = /tbox/api/me/password/ {
        limit_req zone=tbox_login burst=10 nodelay;
        limit_req_status 429;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_hide_header X-Powered-By;
    }
    location = /tbox/api/me/mfa/enroll {
        limit_req zone=tbox_login burst=10 nodelay;
        limit_req_status 429;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_hide_header X-Powered-By;
    }
    location = /tbox/api/me/mfa/enroll/ {
        limit_req zone=tbox_login burst=10 nodelay;
        limit_req_status 429;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
