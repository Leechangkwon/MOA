    # ─── 12-2 미리보기 원본(inline) 경로 — 프레임 허용은 이 경로만 (PRD F-18, ARCH 5.8, SECURITY R-41) ───
    # 응답의 CSP 는 PHP(Storage::streamInline)가 보내는 `sandbox; default-src 'none'; frame-ancestors 'self'` 하나다.
    # nginx 는 location 안에 add_header 가 있으면 상위 헤더(CSP frame-ancestors 'none' · X-Frame-Options DENY)를
    # 물려주지 않으므로, 여기서는 프레임을 막지 않는 헤더만 다시 적는다. 같은 출처(t-box 화면)의
    # <iframe sandbox> 만 이 응답을 끼울 수 있고, 다른 사이트는 frame-ancestors 'self' 가 막는다.
    # sandbox 는 문서 안 스크립트·폼·같은 출처 접근을 전부 끈다.
    # 정규식 location 은 `location /` 접두 매칭보다 우선하므로 이 블록이 raw 요청을 먼저 잡는다.
    # SCRIPT_FILENAME 을 index.php 로 고정하는 것은 `= /api/login` 과 같은 방식이며,
    # REQUEST_URI 는 그대로 전달되므로 라우터(Http::path)가 같은 경로를 본다.
    # 정규식에 `{36}` 처럼 중괄호가 들어가면 nginx 가 블록 괄호로 읽으므로 **따옴표로 감싼다**
    # (따옴표가 없으면 `nginx -t` 가 `unknown directive "36}/preview/raw$"` 로 실패한다 — 2026-09-12 실측).
    location ~ "^/tbox/api/files/[0-9a-f-]{36}/preview/raw$" {
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ─── PHP 는 index.php 하나만 실행 ───
    # ─── 15-2 공유 링크 받기 — 속도 제한 (PRD F-13, ARCH 5.12, SECURITY R-57) ───
    # zone 정의는 conf.d/tbox-common.conf (http 컨텍스트). 초과 요청은 429.
    # 정규식은 라우터의 자리표시자 `{token}`(`[A-Za-z0-9_-]{43}`)과 **같은 값**이다 —
    # 형태가 다른 요청은 여기 걸리지 않고 `location /` 로 가 앱에서 404 가 된다.
    # 정규식에 `{43}` 처럼 중괄호가 들어가면 nginx 가 블록 괄호로 읽으므로 **따옴표로 감싼다**
    # (12-2 의 preview/raw 블록과 같은 이유).
    # ★ 이 블록에는 add_header 를 **하나도 두지 않는다** — nginx 는 location 안에 add_header 가
    #   하나라도 있으면 상위(server)의 보안 헤더 4개를 물려주지 않는다. 공유 다운로드도
    #   다른 응답과 똑같은 CSP·nosniff·DENY·no-referrer 를 받아야 한다.
    location ~ "^/tbox/s/[A-Za-z0-9_-]{43}$" {
        limit_req zone=tbox_share burst=10 nodelay;
        limit_req_status 429;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }


    # ─── 17-1 관리자 영역을 관리망에서만 (PRD F-24 「네트워크 겹」, ARCH 5.14, SECURITY R-61) ───
    #
    # ★ 기본은 **꺼짐**이다. 아래 두 블록은 주석이며, 이 파일의 활성 설정은 17단계에서
    #   한 줄도 바뀌지 않았다. 켜는 것은 사용자 결정이다.
    #
    # 왜 꺼 두나: 이 서비스의 접속 출처가 셋이다 — 사내망 두 대역과 프록시 경유 외부.
    # 자기 출처가 allow 목록에 없는 채로 켜면 **관리자 자신이 관리자 영역에서 잠긴다**
    # (hardening.sh 8.4-16 의 관리망 기본값 결함과 똑같은 함정). 게다가 이 VM 은 프록시
    # 뒤에 있어 `$remote_addr` 는 언제나 프록시 IP 다 — 위 `set_real_ip_from` 이 복원한
    # 실제 IP 를 기준으로 삼아야 하며(그래서 allow 에 프록시 IP 를 적으면 안 된다),
    # 프록시를 거쳐 오는 외부 접속은 **모두 같은 출처로 보인다**.
    #
    # 켜는 법 (README 「관리자 영역을 관리망에서만(선택, 기본 꺼짐)」 절)
    #   ① 지금 내 출처를 먼저 확인한다:
    #        sudo tail -n 50 /var/log/nginx/tbox-v2.access.log      ← 첫 칸이 복원된 실제 IP
    #   ② 그 대역을 allow 에 적는다(여러 줄 가능). deny all 은 마지막에 그대로 둔다.
    #   ③ 주석을 풀고  sudo nginx -t  →  sudo systemctl reload nginx
    #   ④ **다른 창을 열어 둔 채** /admin 접속을 확인한다. 잠기면 ③을 되돌린다.
    # 막는 순서: nginx(여기) → 라우트 정책 role:Admin → 재인증 15분 창. 이 블록을 켜지
    # 않아도 뒤의 두 겹은 그대로 동작한다 (SECURITY R-61).
    #
    # location ^~ /tbox/admin {
    #     allow 10.0.4.0/24;          # ← 관리망 대역 (실제 값으로 바꾼다)
    #     deny  all;
    #     include       fastcgi_params;
    #     fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    #     fastcgi_param HTTPS on;
    #     fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
    #     fastcgi_read_timeout 60s;
    #     fastcgi_hide_header X-Powered-By;
    # }
    # location ^~ /tbox/api/admin {
    #     allow 10.0.4.0/24;
    #     deny  all;
    #     include       fastcgi_params;
    #     fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    #     fastcgi_param HTTPS on;
    #     fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
    #     fastcgi_read_timeout 60s;
    #     fastcgi_hide_header X-Powered-By;
    # }

    # ─── 커뮤니티 페이지 화면 — 임베드 틀 (커뮤니티 7-C K-5 · 사용자 「임베드 허용해라」 2026-09-24 · d57 다시 만들어 켜기 2026-09-26) ───
    # 이 응답만 CSP 를 앱(src/bootstrap.php 4절 + community_embed_csp)이 붙인 것 **하나**로 둔다. 앱은 이 화면에만 CSP 에
    # `frame-src <임베드 허용 목록>` 을 더하는데, server 단 CSP(frame-src 없음 → default-src 'self')가 함께 오면 브라우저는
    # 두 정책을 **모두** 적용해 틀이 빈다(독립 검토 7-C M-1). 그래서 이 location 에는 CSP 를 적지 않는다.
    # nginx 는 location 안에 add_header 가 하나라도 있으면 위 단(server)의 add_header 를 **모두** 물려받지 않으므로
    # CSP 를 뺀 나머지 보안 헤더를 전부 다시 적는다(server 단 목록과 같은 값 · always).
    #   · 앱은 모든 응답의 맨 앞(bootstrap 4절)에 CSP·nosniff·X-Frame-Options·Referrer-Policy 를 붙인다 — 이 경로의 앱 응답에
    #     CSP 가 없는 경우는 없다(미로그인 302 · 403 · 404 도 같은 머리). 앱 CSP 기본값은 server 단 CSP 와 **같은 글자**다.
    #   · 이 경로 말고는(커뮤니티 홈·창구·t-box 화면·자산·로그인) 전과 같이 nginx CSP 와 앱 CSP 가 둘 다 붙는다.
    #     옛 판(/var/www/qaredi/scripts/apply-nginx-embed-csp-2026-09-24.sh)은 `location = /index.php` 전체에서 nginx CSP 를 뺐다 — 이 판은 한 화면만.
    #   · 정규식은 라우터 자리표시자 `{id}`(`[0-9a-f-]{36}`, public/index.php TBOX_PATH_PATTERNS)와 같은 모양이다. 끝 슬래시·다른 모양은
    #     `location /` 로 가 CSP 가 둘인 채다(틀이 빈다 — 닫힌 쪽). 정규식의 `{36}` 은 블록 괄호로 읽히지 않게 따옴표로 감싼다.
    #   · server 단 `if ($tbox_via_proxy = 0)`(R-31 보안 넷)는 rewrite 단계라 location 을 고르기 전에 돈다 — 이 경로도 같은 관문 뒤다.
    # 되돌리기: sudo bash /var/www/qaredi/scripts/apply-nginx-embed-csp-2026-09-26.sh --rollback <백업 폴더>
    location ~ "^/community/p/[0-9a-f-]{36}$" {
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location = /index.php {
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # 이 서버 블록은 평문 80 을 받지만 브라우저 기준 스킴은 언제나 https 다(프록시가 TLS 종단·
        # http→https 301). 따라서 PHP 에는 HTTPS=on 을 고정으로 알려 준다 —
        # session.cookie_secure / Secure 쿠키 / APP_URL 판단이 프록시 뒤에서도 맞게 동작한다.
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }

    # 그 외 .php 요청은 실행하지 않는다 → 단일 입구 강제, 검사 우회 경로 없음
    location ~ \.php$ { return 404; }
}
