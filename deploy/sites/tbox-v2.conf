# deploy/sites/tbox-v2.conf — v2(이 저장소) 공개용 사이트 (ARCHITECTURE 3장 배포 메모 · 8장)
#
# 설치 위치: /etc/nginx/sites-available/tbox-v2  (deploy/switch-site.sh 가 복사)
# 공개 경로: 브라우저 ──https──▶ 강사 리버스 프록시(changkwon.mso.so, TLS 종단, http→https 301)
#                        └──http──▶ 이 VM 의 80 포트 (프록시 내부 IP 192.168.104.100)
#
# 그러므로 이 파일에는 TLS 가 없다. VM 은 TLS 를 하지 않고 80 만 받는다 (S-09-1 은 프록시가 충족).
# 80 포트에는 한 번에 한 버전만 꽂힌다 — `sudo bash deploy/switch-site.sh v2` 로 고른다.
#
# 저장소는 /var/www/tbox-v2 — v1 웹 루트(/var/www/html) 밖이다. 그러므로 v1 경유로
# 이 저장소의 소스·.env·SQL 에 닿는 URL 자체가 없다 (SECURITY R-29 해소).

server {
    listen              80 default_server;
    listen              [::]:80 default_server;
    server_name         changkwon.mso.so _;

    # ─── 실제 접속 IP 복원 (ARCH 3장, SECURITY R-30 · R-31) ───
    # 프록시 IP(192.168.104.100)가 보낸 X-Forwarded-For 만 신뢰한다.
    # 사내망 다른 곳에서 VM 80 에 직접 붙어 XFF 를 위조해도 그 헤더는 무시된다(R-31).
    # real_ip_recursive off — 체인의 마지막(프록시가 붙인) 값 하나만 쓰고 거슬러 올라가지 않는다.
    set_real_ip_from    192.168.104.100;
    real_ip_header      X-Forwarded-For;
    real_ip_recursive   off;

    root  /var/www/tbox-v2/public;            # ★ public/ 만 노출 — src/·db/·deploy/·.env 는 URL 에 없다
    index index.php;

    charset utf-8;

    # 서버 종류·버전 숨김 (정찰 정보 최소화)
    server_tokens off;

    # PRD S-06: 100MB 초과는 앱에 닿기 전 413.
    # 6단계 결정(2026-09-11, ARCH 8장): 100m 이면 multipart 오버헤드 때문에 정확히 100MB 파일까지
    # 413 이 된다(3단계 재검토 실측). nginx 는 101m 으로 요청 전체를 받고, 정확한 100MB
    # (104,857,600 B) 경계는 PHP Upload::MAX_BYTES 가 판정한다. 101MB 파일은 여전히 nginx 413.
    client_max_body_size 101m;

    # UA 없는 프록시 헬스체크(2초 간격)는 로그에 남기지 않는다. 형식 정의는 conf.d/tbox-common.conf
    access_log /var/log/nginx/tbox-v2.access.log tbox_proxy if=$tbox_loggable;
    error_log  /var/log/nginx/tbox-v2.error.log;

    # ─── 보안 헤더 (PRD S-09-9) + HSTS (PRD S-09-1, SECURITY R-28) ───
    # PHP(src/bootstrap.php)에서도 같은 헤더를 붙인다 — 어느 한쪽 설정이 빠져도 남는다.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # HSTS 는 공개용(이 파일)에만. 브라우저는 프록시를 통해 항상 https 로 보므로 유효하다.
    # 로컬용(tbox-v2-local, 127.0.0.1:8082 평문)에는 넣지 않는다 — localhost 를 https 로 강제하면 못 본다.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ─── 숨김 파일(.env, .git, .htaccess …) ───
    # ARCH 8장은 `deny all`(403) 이지만, PRD 13장 1단계 통과 기준이 "전부 404" 이므로 404 로 맞춘다.
    # 403 은 "있지만 막혔다" 를 알려 주는 정보다. 404 는 존재 여부 자체를 숨긴다 (PRD S-09-5 취지).
    location ~ /\. { return 404; }

    # ─── 정적 파일 ───
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # ─── 다운로드 가속: PHP 가 권한 확인 후 X-Accel-Redirect 로 넘기는 내부 경로 ───
    # internal 이므로 외부에서 /protected/... 를 직접 요청하면 404 다 (T-10).
    location /protected/ {
        internal;
        alias /var/lib/tbox-v2/storage/;
    }

    # ─── 나머지는 전부 index.php 로 (단일 입구) ───
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # ─── 로그인 IP 속도 제한 (PRD S-09-8, ARCHITECTURE 4.0 · 8장, SECURITY R-06) ───
    # zone 정의는 conf.d/tbox-common.conf (http 컨텍스트). 초과 요청은 429.
    # 이 location 은 `try_files` 를 거치지 않고 바로 PHP 로 간다 — 그래도 REQUEST_URI 가
    # /api/login 그대로 전달되므로 Http::path() 가 같은 경로를 보고 라우트가 매칭된다.
    # `= /api/login/` 을 함께 둔 이유: 앱이 경로 끝의 `/` 를 떼고 매칭하므로,
    # 이 블록이 없으면 `/api/login/` 로 속도 제한만 우회할 수 있다(nginx 는 `//` 도 여기로 합친다).
    location = /api/login {
        limit_req zone=tbox_login burst=10 nodelay;
        limit_req_status 429;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_hide_header X-Powered-By;
    }
    location = /api/login/ {
        limit_req zone=tbox_login burst=10 nodelay;
        limit_req_status 429;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_hide_header X-Powered-By;
    }

    # ─── PHP 는 index.php 하나만 실행 ───
    location = /index.php {
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # 이 서버 블록은 평문 80 을 받지만 브라우저 기준 스킴은 언제나 https 다(프록시가 TLS 종단·
        # http→https 301). 따라서 PHP 에는 HTTPS=on 을 고정으로 알려 준다 —
        # session.cookie_secure / Secure 쿠키 / APP_URL 판단이 프록시 뒤에서도 맞게 동작한다.
        fastcgi_param HTTPS on;
        fastcgi_pass  unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }

    # 그 외 .php 요청은 실행하지 않는다 → 단일 입구 강제, 검사 우회 경로 없음
    location ~ \.php$ { return 404; }
}
