    # MOA-WHITEBOARD-BEGIN
    location = /community/whiteboard-relay {
        limit_req zone=whiteboard_handshake burst=20 nodelay;
        limit_conn whiteboard_connections 40;
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_send_timeout 15s;
    }
    location ~ "^/community/p/[0-9a-f-]{36}/whiteboard$" {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.1-fpm-tbox.sock;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    # MOA-WHITEBOARD-END
