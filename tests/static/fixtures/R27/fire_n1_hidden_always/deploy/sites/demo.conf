# 견본(가짜) — N1: ① 앱으로 넘기는 블록이지만 CSP 를 fastcgi_hide_header 로 숨겨 붙일 곳이 없다
#               ② 다시 적으면서 always 를 빠뜨려 4xx·5xx 에는 헤더가 없다(낮음)
server {
    listen 80;
    server_name demo.example.invalid;
    root /srv/demo/public;

    add_header Content-Security-Policy "default-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location ~ "^/demo/embed/[0-9a-f]{8}$" {
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass  unix:/run/php/demo.sock;
        fastcgi_hide_header Content-Security-Policy;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /demo/help.html {
        alias /srv/demo/public/help.html;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
