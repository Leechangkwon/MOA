# 견본(가짜) — N1: ① include 조각으로 다시 적는데 조각에 헤더 하나가 없다 ② if 안의 add_header 하나가 위 단 헤더를 모두 끊는다
server {
    listen 80;
    server_name demo.example.invalid;
    root /srv/demo/public;

    add_header Content-Security-Policy "default-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /demo/manifest.json {
        alias /srv/demo/public/manifest.json;
        include /etc/nginx/snippets/demo-headers.conf;
    }

    location /demo/files/ {
        alias /srv/demo/files/;
        if ($arg_download) {
            add_header Content-Disposition "attachment" always;
        }
    }
}
