# 견본(가짜) — N1: 정적 파일 location 에 CSP 만 다시 적어 나머지 보안 헤더 셋을 잃는다
server {
    listen 80;
    server_name demo.example.invalid;
    root /srv/demo/public;

    add_header Content-Security-Policy "default-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /demo/tool.html {
        alias /srv/demo/public/tool.html;
        expires 1h;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
