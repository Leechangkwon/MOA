# 견본(가짜) — N2: 공통 파일에 있는 map 을 사이트 파일 맨 위에 한 번 더 정의(뒤의 것이 덮는다)
map $arg_v $demo_cache_age {
    default 1h;
}

server {
    listen 80;
    server_name demo.example.invalid;
    root /srv/demo/public;

    location /demo/assets/ {
        alias /srv/demo/public/assets/;
        expires $demo_cache_age;
    }
}
