# 견본(가짜) — N2: 정의 없는 변수 두 곳(글자 틀림 · 어디에도 없는 변수)
server {
    listen 80;
    server_name demo.example.invalid;
    root /srv/demo/public;

    location /demo/assets/ {
        alias /srv/demo/public/assets/;
        expires $demo_cahce_age;
    }

    location = /demo/version.txt {
        alias /srv/demo/public/version.txt;
        add_header X-Demo-Build $demo_build_id;
    }

    location / {
        try_files $uri $uri/ /index.html?$args;
    }
}
