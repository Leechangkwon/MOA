# 견본(가짜) — N3: `http { … }` 로 감싼 한 파일 · server 단 text/json · location 의 `*`(모든 형식)
http {
    server {
        listen 80;
        server_name demo.example.invalid;
        root /srv/demo/public;
        gzip_types text/json;

        location /demo/api/ {
            gzip_types *;
            try_files $uri /index.php$is_args$args;
        }
    }
}
