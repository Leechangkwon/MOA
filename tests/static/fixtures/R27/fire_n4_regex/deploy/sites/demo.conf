# 견본(가짜) — N4: 정규식 location 의 alias 가 `..` 를 막지 않는 캡처를 잇는다(번호 캡처 · 이름 캡처)
server {
    listen 80;
    server_name demo.example.invalid;
    root /srv/demo/public;

    location ~ ^/demo/files/(.+)$ {
        alias /srv/demo/files/$1;
    }

    location ~* "^/demo/img/(?<name>[^?]*)$" {
        alias /srv/demo/img/$name;
        expires 1d;
    }
}
