# 견본(가짜) — N5: TLS 프록시 뒤 평문 server 의 상대 리다이렉트(return · rewrite permanent)에 absolute_redirect off 가 없다
server {
    listen 80;
    server_name demo.example.invalid;
    root /srv/demo/public;

    location /old/ {
        return 301 /demo$request_uri;
    }

    rewrite ^/legacy/(.*)$ /demo/$1 permanent;

    location / {
        try_files $uri /index.html;
    }
}
