# 견본(가짜) — N5: ① server 의 off 를 location 이 on 으로 되돌림 ② off 가 없는 둘째 server 의 $request_uri 리다이렉트
server {
    listen 80;
    server_name demo.example.invalid;
    root /srv/demo/public;
    absolute_redirect off;

    location /a/ {
        absolute_redirect on;
        return 301 /b/;
    }

    location /c/ {
        return 301 /d/;
    }
}

server {
    listen 8080;
    server_name alt.example.invalid;
    location / {
        return 307 $request_uri;
    }
}
