# 견본(가짜) — 공개용
server {
    listen 80;
    server_name demo.example.invalid;
    root /srv/demo/public;
    client_max_body_size 20m;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /demo/files/ {
        internal;
        alias /srv/demo/files/;
    }
}
