# 견본(가짜) — 소켓 풀 하나 · TCP upstream 풀 하나
upstream demo_batch {
    server 127.0.0.1:9101;
}

server {
    listen 80;
    server_name demo.example.invalid;
    root /srv/demo/public;
    fastcgi_read_timeout 60s;

    location = /index.php {
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass  unix:/run/php/demo.sock;
    }

    location = /demo/report {
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass  unix:/run/php/demo.sock;
        fastcgi_read_timeout 2m;
    }

    location = /demo/batch {
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/batch.php;
        fastcgi_pass  demo_batch;
    }
}
