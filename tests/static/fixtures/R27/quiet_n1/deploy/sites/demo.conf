# 견본(가짜) — N1 조용: 다시 적기(값은 달라도 됨) · 조각 include · 앱으로 넘기는 블록 · add_header 없는 블록 · # 뒤 add_header 는 주석
server {
    listen 80;
    server_name demo.example.invalid;
    root /srv/demo/public;

    add_header Content-Security-Policy "default-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /demo/tool.html {
        alias /srv/demo/public/tool.html;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /demo/manifest.json {
        alias /srv/demo/public/manifest.json;
        include snippets/demo-headers.conf;
    }

    # 앱이 CSP 를 붙이는 미리보기 — 프레임만 넓힌다(뒤로 넘기므로 판정하지 않는다)
    location ~ "^/demo/preview/[0-9a-f]{8}$" {
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass  unix:/run/php/demo.sock;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /demo/assets/ {
        alias /srv/demo/public/assets/;
        expires 7d;
        # add_header Cache-Control "immutable";   ← 넣으면 상속이 끊긴다
    }
}

server {
    listen 127.0.0.1:8099;
    server_name _;
    root /srv/demo/public;
    # 이 server 에는 보안 헤더가 없다 — location 의 add_header 가 끊을 것도 없다
    location = /demo/ping.txt {
        alias /srv/demo/public/ping.txt;
        add_header X-Demo "1";
    }
}
