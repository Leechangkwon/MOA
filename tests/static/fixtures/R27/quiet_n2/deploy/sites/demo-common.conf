# 견본(가짜) — http 단 공통. expires 가 읽는 값 모양 모음 · 로그 거르기 map · 속도 제한 열쇠
log_format demo_fmt '$remote_addr "$realip_remote_addr" [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';

map $http_user_agent $demo_loggable {
    default 1;
    ""      0;
}

map $arg_v $demo_cache_age {
    default          7d;
    "~^[0-9a-f]{8}$" 1y;
    "~^[0-9]{10}$"   1d12h;
    "~^max$"         max;
    "~^off$"         off;
    "~^epoch$"       epoch;
    "~^daily$"       @15h30m;
    "~^neg$"         -1;
    "~^plus$"        +30m;
}
