# 견본(가짜) — N2 조용: 내장 변수 · 공통 map · set · 정규식 이름 캡처·번호 캡처 · 정규식 안의 `$`(끝 표시)
server {
    listen 80;
    server_name demo.example.invalid;
    root /srv/demo/public;
    access_log /var/log/demo.access.log demo_fmt if=$demo_loggable;

    set $demo_root /srv/demo/public;

    location /demo/assets/ {
        alias /srv/demo/public/assets/;
        expires $demo_cache_age;
    }

    location ~ "^/demo/u/(?<user>[a-z]{3,16})/(\d+)$" {
        add_header X-Demo-User $user;
        add_header X-Demo-Page $2;
        try_files /users/$user.html =404;
    }

    location ~ \.html$ {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        try_files $uri =404;
        add_header X-Demo-Root ${demo_root};
    }

    location / {
        try_files $uri $uri/ /index.html$is_args$args;
    }
}
