# 견본(가짜) — N4 조용: 좁은 캡처 · 끝 / 짝 · 정확 일치 · alias 에 캡처를 쓰지 않는 정규식
server {
    listen 80;
    server_name demo.example.invalid;
    root /srv/demo/public;

    location ~ "^/demo/files/([0-9a-f]{32})$" {
        alias /srv/demo/files/$1;
    }

    location ~ ^/demo/docs/(?<slug>[a-z0-9-]+)\.html$ {
        alias /srv/demo/docs/$slug.html;
    }

    location /demo/static/ {
        alias /srv/demo/static/;
    }

    location ^~ /demo/pub/ {
        alias /srv/demo/pub/;
    }

    location = /demo/one.txt {
        alias /srv/demo/one.txt;
    }

    location ~ ^/demo/logo\.(png|svg)$ {
        alias /srv/demo/brand/logo.svg;
    }
}
