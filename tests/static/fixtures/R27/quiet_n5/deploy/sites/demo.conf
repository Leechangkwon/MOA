# 견본(가짜) — N5 조용: server 단 absolute_redirect off 상속 · 절대 주소 · $scheme 주소 · 내부 rewrite · ssl 만 듣는 server
server {
    listen 80;
    server_name demo.example.invalid;
    root /srv/demo/public;
    absolute_redirect off;

    location /old/ {
        return 308 /demo$request_uri;
    }

    location = /home {
        return 302 https://demo.example.invalid/demo/;
    }

    location = /here {
        return 302 $scheme://$host/demo/here;
    }

    rewrite ^/short/(.*)$ /demo/$1 last;
}

server {
    listen 443 ssl;
    server_name tls.example.invalid;
    root /srv/demo/public;
    ssl_certificate     /srv/demo/tls/fake.crt;
    ssl_certificate_key /srv/demo/tls/fake.key;

    location /old/ {
        return 301 /demo$request_uri;
    }
}
