# 견본(가짜) — 로컬용(127.0.0.1 평문 — HSTS 없음은 비교하지 않는다) · 의도한 차이 하나는 표식으로 뺀다
server {
    listen 127.0.0.1:8090;
    server_name _;
    root /srv/demo/public;
    access_log /var/log/demo-local.access.log;

    add_header X-Content-Type-Options "nosniff" always;

    location = /demo/tool.html {
        alias /srv/demo/public/tool.html;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /demo/assets/ {
        alias /srv/demo/public/assets/;
        # 검토 포트는 새로 고침마다 새 파일을 보려고 짧게 둔다 — qcheck-allow: R27
        expires 1m;
    }

    location = /demo/api/login {
        limit_req zone=demo_login burst=5 nodelay;
        try_files $uri /index.php$is_args$args;
    }
    location = /demo/api/login/ {
        limit_req zone=demo_login burst=5 nodelay;
        try_files $uri /index.php$is_args$args;
    }
}
