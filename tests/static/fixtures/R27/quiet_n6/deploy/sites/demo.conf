# 견본(가짜) — 공개용(프록시 뒤 평문 80 — HSTS 는 여기만)
server {
    listen 80;
    server_name demo.example.invalid;
    root /srv/demo/public;
    access_log /var/log/demo.access.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /demo/tool.html {
        alias /srv/demo/public/tool.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location /demo/assets/ {
        alias /srv/demo/public/assets/;
        expires 7d;
    }

    location = /demo/api/login {
        limit_req zone=demo_login burst=5 nodelay;
        try_files $uri /index.php$is_args$args;
    }
    location = /demo/api/login/ {
        limit_req zone=demo_login burst=5 nodelay;
        try_files $uri /index.php$is_args$args;
    }
}
