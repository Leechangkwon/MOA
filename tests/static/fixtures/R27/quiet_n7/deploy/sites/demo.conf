# 견본(가짜) — N7 조용: 정의된 zone · 정확 일치마다 같은 zone 의 끝 슬래시 변형 · 정규식·접두 location 은 짝을 묻지 않음
server {
    listen 80;
    server_name demo.example.invalid;
    root /srv/demo/public;
    limit_conn demo_conn 10;

    location = /demo/api/login {
        limit_req zone=demo_login burst=5 nodelay;
        limit_req_status 429;
        try_files $uri /index.php$is_args$args;
    }
    location = /demo/api/login/ {
        limit_req zone=demo_login burst=5 nodelay;
        limit_req_status 429;
        try_files $uri /index.php$is_args$args;
    }

    location = /demo/api/time {
        try_files $uri /index.php$is_args$args;
    }

    location ~ "^/demo/s/[A-Za-z0-9]{20}$" {
        limit_req zone=demo_share burst=10 nodelay;
        try_files $uri /index.php$is_args$args;
    }

    location /demo/api/ {
        location = /demo/api/me/pin {
            limit_req zone=demo_login burst=5 nodelay;
            try_files $uri /index.php$is_args$args;
        }
        location = /demo/api/me/pin/ {
            limit_req zone=demo_login burst=5 nodelay;
            try_files $uri /index.php$is_args$args;
        }
        try_files $uri /index.php$is_args$args;
    }
}
