; 견본(가짜) php-fpm 풀 — N8 조용: 같음(60s) · 0(끔) · 없음 · nginx 가 쓰지 않는 풀
[demo]
listen = /run/php/demo.sock
request_terminate_timeout = 60s

[idle]
listen = /run/php/idle.sock
request_terminate_timeout = 0

[plain]
listen = /run/php/plain.sock

[unused]
listen = /run/php/unused.sock
request_terminate_timeout = 10s
