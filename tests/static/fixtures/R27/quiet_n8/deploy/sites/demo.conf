# 견본(가짜) — N8 조용
server {
    listen 80;
    server_name demo.example.invalid;
    root /srv/demo/public;

    location = /index.php {
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass  unix:/run/php/demo.sock;
        fastcgi_read_timeout 1m;
    }

    location = /demo/idle {
        include       fastcgi_params;
        fastcgi_pass  unix:/run/php/idle.sock;
    }

    location = /demo/plain {
        include       fastcgi_params;
        fastcgi_pass  unix:/run/php/plain.sock;
        fastcgi_read_timeout 300s;
    }
}
